pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings")
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0' }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex ->
    ex.autolinkLibrariesFromCommand([
        "/opt/homebrew/bin/node",
        "node_modules/@react-native-community/cli/build/bin.js",
        "config"
    ])
}
rootProject.name = 'FreshRNcliApp'
include ':app'
include ':react-native-vector-icons_ionicons'
project(':react-native-vector-icons_ionicons').projectDir = new File(rootProject.projectDir, '../node_modules/@react-native-vector-icons/ionicons/android')
includeBuild('../node_modules/@react-native/gradle-plugin')
